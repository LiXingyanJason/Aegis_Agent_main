[project]
name = "aegis-calendar-mcp-server"
version = "0.1.0"
description = "Aegis 内部日历 MCP 工具服务"
requires-python = ">=3.12"
dependencies = [
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.0,<3.0",
  "mcp==2.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["aegis_calendar_mcp*"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]
