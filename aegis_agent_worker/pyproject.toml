[project]
name = "aegis-agent-worker"
version = "0.1.0"
description = "Aegis independent Agent Worker service"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.29,<1.0",
  "redis>=5.0,<6.0",
  "pydantic-settings>=2.6,<3.0",
  "httpx>=0.27,<1.0",
  "opentelemetry-api>=1.28,<2.0",
  "opentelemetry-sdk>=1.28,<2.0",
  "opentelemetry-instrumentation-httpx>=0.49b0,<1.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0,<1.0",
  "opentelemetry-instrumentation-redis>=0.49b0,<1.0",
  "mcp==2.3.0",
  "langgraph>=0.2,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
