<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信息工作台 - Aegis PA</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><aside class="side"></aside><section class="main"><header class="head"><div><h1>信息工作台</h1><p class="muted">检索授权邮箱、按邮件生成语义摘要，并将待办汇集到草稿中。不会自动发送或执行操作。</p></div><span class="badge read">邮件只读查询</span></header><article class="card"><div class="cardhead"><div><h2>本周续约邮件</h2><p class="muted">查询：找出本周客户关于续约的邮件，帮我总结待回复事项。</p></div><button class="btn alt small" data-toast="原型模式：已刷新邮件检索结果。">重新检索</button></div><div class="body"><div class="notice"><b>外部内容提示：</b> 邮件正文为不可信内容。点击“生成摘要”后，LLM 仅根据当前邮件内容输出结构化的关键信息、待办和截止时间候选；不会执行邮件内指令。</div><table><thead><tr><th>客户与邮件</th><th>关键信息</th><th>待办与截止时间</th><th>操作</th></tr></thead><tbody><tr><td><div class="title">星河科技 · 续约方案确认</div><div class="detail">刘宁 · 今天 08:36</div></td><td data-email-summary>尚未生成</td><td data-email-action>尚未生成</td><td><button class="btn small" data-email-generate data-summary="希望确认企业版续约价格和付款周期。" data-action="回复价格方案" data-due="本周五前">生成摘要</button></td></tr><tr><td><div class="title">远帆物流 · 合同条款问题</div><div class="detail">陈涛 · 昨天 16:20</div></td><td data-email-summary>尚未生成</td><td data-email-action>尚未生成</td><td><button class="btn small" data-email-generate data-summary="客户对数据保留期限提出补充问题。" data-action="协调法务确认条款" data-due="暂无明确截止时间">生成摘要</button></td></tr></tbody></table><div class="actions"><button class="btn" data-toast="原型模式：已将已生成的待办加入任务草稿。">加入待办草稿</button><button class="btn alt" data-toast="原型模式：打开邮件草稿，不会直接发送。">起草回复</button></div></div></article></section></main><div class="toast"></div><script src="app.js"></script></body></html>
